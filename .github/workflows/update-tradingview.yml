name: TV Watchlist Update (Playwright)

on:
  repository_dispatch:
    types: [build_complete]
  workflow_dispatch:

concurrency:
  group: tv-watchlist-updater
  cancel-in-progress: true

jobs:
  run:
    # A normal local Edge profile is used via CDP. GitHub-hosted runners
    # cannot access that interactive profile or its TradingView session.
    runs-on: [self-hosted, Windows, tv-watchlist]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          npm ci --no-audit --no-fund

      - name: Run updater
        env:
          TRADINGVIEW_STORAGE_STATE: ${{ secrets.TRADINGVIEW_STORAGE_STATE }}
          TRADINGVIEW_USERNAME: ${{ secrets.TRADINGVIEW_USERNAME }}
          TRADINGVIEW_EMAIL: ${{ secrets.TRADINGVIEW_EMAIL }}
          TRADINGVIEW_PASSWORD: ${{ secrets.TRADINGVIEW_PASSWORD }}
          WATCHLIST_1_URL: ${{ secrets.WATCHLIST_1_URL }}
          WATCHLIST_2_URL: ${{ secrets.WATCHLIST_2_URL }}
          WATCHLIST_1_NAME: ${{ vars.WATCHLIST_1_NAME }}
          WATCHLIST_2_NAME: ${{ vars.WATCHLIST_2_NAME }}
          DO_DELETE_ALERTS: "true"
          DO_DELETE_WATCHLISTS: "true"
          DO_IMPORT_WATCHLISTS: "true"
          DO_CREATE_WATCHLIST_ALERT: "true"
          ALERT_CONDITION_NAME: ${{ vars.ALERT_CONDITION_NAME }}
          ALERT_TIMEFRAME_LABEL: ${{ vars.ALERT_TIMEFRAME_LABEL }}
          TRADINGVIEW_ALERT_WEBHOOK_URL: ${{ secrets.TRADINGVIEW_ALERT_WEBHOOK_URL }}
          TRADINGVIEW_CDP_URL: http://127.0.0.1:9223
        run: npm run update

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-debug
          path: tmp/**/*.png
          if-no-files-found: ignore

      - name: Notify Discord on Success
        if: success()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_1: ${{ secrets.DISCORD_WEBHOOK_1 }}
          DISCORD_WEBHOOK_2: ${{ secrets.DISCORD_WEBHOOK_2 }}
        run: |
          $payload = @{ username = "System Log"; content = "🟢 **[System] Browser Automation Success**"; embeds = @(@{ title = "Update Completed"; description = "TradingViewのウォッチリストとアラートの更新がすべて完了しました！"; color = 65280 }) } | ConvertTo-Json -Depth 4 -Compress
          foreach ($item in @(@{ Name = "DISCORD_WEBHOOK_1"; Url = $env:DISCORD_WEBHOOK_1 }, @{ Name = "DISCORD_WEBHOOK_2"; Url = $env:DISCORD_WEBHOOK_2 })) {
            if ([string]::IsNullOrWhiteSpace($item.Url)) { Write-Warning "$($item.Name) is empty. Skip."; continue }
            try { Invoke-RestMethod -Method Post -Uri $item.Url -ContentType "application/json" -Body $payload | Out-Null } catch { Write-Warning "Failed to send Discord notification: $($item.Name)" }
          }

      - name: Notify Discord on Failure
        if: failure()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_1: ${{ secrets.DISCORD_WEBHOOK_1 }}
          DISCORD_WEBHOOK_2: ${{ secrets.DISCORD_WEBHOOK_2 }}
        run: |
          $payload = @{ username = "System Log"; content = "🔴 **[System] Browser Automation Error**"; embeds = @(@{ title = "Playwright Error Log"; url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"; description = "TradingViewの操作中にエラーが発生しました。UI変更の可能性があります。"; color = 16711680 }) } | ConvertTo-Json -Depth 4 -Compress
          foreach ($item in @(@{ Name = "DISCORD_WEBHOOK_1"; Url = $env:DISCORD_WEBHOOK_1 }, @{ Name = "DISCORD_WEBHOOK_2"; Url = $env:DISCORD_WEBHOOK_2 })) {
            if ([string]::IsNullOrWhiteSpace($item.Url)) { Write-Warning "$($item.Name) is empty. Skip."; continue }
            try { Invoke-RestMethod -Method Post -Uri $item.Url -ContentType "application/json" -Body $payload | Out-Null } catch { Write-Warning "Failed to send Discord notification: $($item.Name)" }
          }
